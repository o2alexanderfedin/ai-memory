[project]
name = "ai-hive-memory"
version = "0.0.1"
description = "Per-persona structured memory service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "litellm>=1.40",
    "python-jose[cryptography]>=3.3",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-exporter-otlp>=1.24",
    "python-ulid>=2.2",
    "pypdf>=6.10.2",
    "reportlab>=4.4.10",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-postgresql>=6.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/"]
[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PL", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/ai_hive_memory/api/index.py" = ["E501"]  # embedded HTML/JS template — line length not meaningful

[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_explicit = true
disallow_any_generics = true
exclude = ["alembic/", "tests/integration/bench_"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_hive_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# real_api tests cost real money and require a funded provider account.
# Opt in explicitly with: pytest -m real_api
addopts = "-m 'not real_api'"
markers = [
    "real_api: tests that hit a real LLM provider (opt-in via -m real_api; costs money)",
]
