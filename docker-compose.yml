version: "3.9"
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ai_hive_memory
      POSTGRES_USER: ai_hive
      POSTGRES_PASSWORD: dev_only_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_hive -d ai_hive_memory"]
      interval: 2s
      timeout: 2s
      retries: 10

  service:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://ai_hive:dev_only_password@postgres:5432/ai_hive_memory
      APP_DATABASE_URL: postgresql+psycopg://ai_hive_app:dev_only_password@postgres:5432/ai_hive_memory
      JWT_SECRET: dev_only_secret_change_in_prod
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
